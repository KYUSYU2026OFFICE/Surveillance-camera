<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wi-Fi 監視カメラ (GitHub Pages版)</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #1a1a1a; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    h1 { font-size: 1.2rem; margin-bottom: 15px; color: #aaa; }
    .card { background: #2a2a2a; border-radius: 12px; padding: 20px; width: 100%; max-width: 500px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; margin-bottom: 20px; }
    .status { font-size: 0.9rem; padding: 8px 12px; border-radius: 6px; background: #333; margin-bottom: 15px; word-break: break-all; }
    video { width: 100%; border-radius: 8px; background: #000; aspect-ratio: 16/9; object-fit: cover; }
    button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 1rem; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    button:disabled { background: #555; cursor: not-allowed; }
    .list { margin-top: 15px; text-align: left; }
    .item { display: flex; justify-content: space-between; align-items: center; background: #3a3a3a; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
    .item button { width: auto; margin: 0; padding: 6px 12px; font-size: 0.85rem; }
    .badge { display: inline-block; background: #28a745; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
  </style>
</head>
<body>

  <h1>Wi-Fi 監視カメラ</h1>

  <div class="card">
    <div id="status" class="status">サーバーに接続中...</div>
    
    <!-- video要素には autoplay, playsinline, muted を必ず指定 -->
    <video id="videoPlayer" autoplay playsinline muted></video>

    <div id="controls" style="display:none; margin-top:15px;">
      <p style="font-size: 0.85rem; color:#ccc;">オンライン中のモニター端末:</p>
      <div id="monitorList" class="list"></div>
    </div>
  </div>

  <script>
    // 同一GitHub Pagesアプリ内で識別するためのルームプレフィックス
    const ROOM_PREFIX = "ghp-cam-monitor-";
    const statusEl = document.getElementById('status');
    const videoEl = document.getElementById('videoPlayer');
    const controlsEl = document.getElementById('controls');
    const monitorListEl = document.getElementById('monitorList');

    let localStream = null;
    let peer = null;

    // GoogleのパブリックSTUNサーバーを指定してWebRTCのNAT越えを有効化
    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    };

    // 初期化処理
    async function init() {
      // 1. カメラ権限の確認・取得を試みる
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        // 取得できた場合は「カメラ（送信側）」として動作
        setupCameraMode();
      } catch (err) {
        // カメラが使えない/拒否された場合は「モニター（受信側）」として動作
        setupMonitorMode();
      }
    }

    // --- カメラ（送信側）の動作 ---
    function setupCameraMode() {
      videoEl.srcObject = localStream;
      videoEl.muted = true; // 自分のフィードバック音を防ぐ

      const myId = ROOM_PREFIX + "cam-" + Math.floor(Math.random() * 1000);
      peer = new Peer(myId, peerConfig);

      peer.on('open', (id) => {
        statusEl.innerHTML = `モード: <span class="badge">カメラ (送信機)</span><br>ID: ${id}`;
        controlsEl.style.display = "block";
        scanMonitors();
      });

      peer.on('error', (err) => {
        statusEl.innerText = "エラー: " + err.type;
      });
    }

    // オンラインのモニター端末を検索 (シミュレーション検索)
    function scanMonitors() {
      monitorListEl.innerHTML = "";
      
      // 1〜5番までの固定モニターIDへ接続を試みる
      for (let i = 1; i <= 3; i++) {
        const targetId = ROOM_PREFIX + "mon-" + i;
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <span>モニター #${i}</span>
          <button onclick="connectToMonitor('${targetId}')">映像を送信</button>
        `;
        monitorListEl.appendChild(div);
      }
    }

    function connectToMonitor(targetId) {
      statusEl.innerText = `${targetId} へ接続中...`;
      const call = peer.call(targetId, localStream);

      call.on('stream', () => {
        statusEl.innerText = `送信中 -> ${targetId}`;
      });

      call.on('error', (err) => {
        statusEl.innerText = "接続失敗: モニターが開かれていません";
      });
    }

    // --- モニター（受信側）の動作 ---
    function setupMonitorMode() {
      // 1〜3の固定スロットからランダム/空きIDを取得（簡易的に1を使用）
      const myId = ROOM_PREFIX + "mon-1"; 
      peer = new Peer(myId, peerConfig);

      peer.on('open', (id) => {
        statusEl.innerHTML = `モード: <span class="badge" style="background:#007bff">モニター (受信専用)</span><br>カメラからの接続待機中...`;
      });

      // 送信側からの着信を受信して自動応答
      peer.on('call', (call) => {
        statusEl.innerText = "映像受信中...";
        call.answer(); // 応答

        call.on('stream', (remoteStream) => {
          videoEl.srcObject = remoteStream;
          videoEl.play().catch(e => {
            // 自動再生がブロックされた場合の救済
            statusEl.innerText = "画面を1回タップして再生してください";
            document.body.addEventListener('click', () => videoEl.play(), { once: true });
          });
        });
      });

      peer.on('error', (err) => {
        if(err.type === 'unavailable-id') {
          // mon-1が埋まっている場合は mon-2 で再試行
          retryAsMonitor(2);
        } else {
          statusEl.innerText = "エラー: " + err.type;
        }
      });
    }

    function retryAsMonitor(num) {
      const myId = ROOM_PREFIX + "mon-" + num;
      peer = new Peer(myId, peerConfig);
      peer.on('open', (id) => {
        statusEl.innerHTML = `モード: <span class="badge" style="background:#007bff">モニター (受信専用 #${num})</span><br>待機中...`;
      });
      peer.on('call', (call) => {
        call.answer();
        call.on('stream', (s) => { videoEl.srcObject = s; });
      });
    }

    window.onload = init;
  </script>
</body>
</html>
